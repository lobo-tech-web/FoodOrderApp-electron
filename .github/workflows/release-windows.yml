name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 1.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Configure Windows CA bundle
        shell: pwsh
        run: |
          $certPath = "${env:ProgramFiles}\Git\mingw64\etc\ssl\certs\ca-bundle.crt"
          if (Test-Path $certPath) {
            "SSL_CERT_FILE=$certPath" >> $env:GITHUB_ENV
            "NODE_EXTRA_CA_CERTS=$certPath" >> $env:GITHUB_ENV
          }

      - name: Cache Electron Builder binaries
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: npm ci

      - name: Configure production API routes
        shell: pwsh
        run: Copy-Item .env.example .env

      - name: Set release version from tag
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          npm version $version --no-git-tag-version --allow-same-version

      - name: Set manual release version
        if: github.event_name == 'workflow_dispatch'
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version

      - name: Build and publish GitHub Release
        shell: pwsh
        run: |
          $maxAttempts = 3

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Release attempt $attempt of $maxAttempts"
            npm run release:github

            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            if ($attempt -eq $maxAttempts) {
              exit $LASTEXITCODE
            }

            $delaySeconds = 20 * $attempt
            Write-Warning "Release failed with exit code $LASTEXITCODE. Retrying in $delaySeconds seconds..."
            Start-Sleep -Seconds $delaySeconds
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_REPOSITORY: ${{ vars.UPDATE_REPOSITORY || github.repository }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
